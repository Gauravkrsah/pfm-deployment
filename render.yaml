services:
  - type: web
    name: minimalist-pfm-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: NVIDIA_NIM_ENTRY_MODEL
        value: nvidia/llama-3.1-nemotron-nano-8b-v1
      - key: NVIDIA_NIM_MAX_TOKENS
        value: "1200"
