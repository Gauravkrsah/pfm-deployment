services:
  - type: web
    name: minimalist-pfm-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: NVIDIA_NIM_ENTRY_MODEL
        value: nvidia/llama-3.1-nemotron-nano-8b-v1
      - key: NVIDIA_NIM_MULTIMODAL_MODEL
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - key: NVIDIA_NIM_TTS_URL
        value: https://877104f7-e885-42b9-8de8-f6e4c6303969.invocation.api.nvcf.nvidia.com/v1/audio/synthesize
      - key: NVIDIA_NIM_TTS_VOICE
        value: Magpie-Multilingual.EN-US.Aria
      - key: NVIDIA_NIM_TTS_TIMEOUT
        value: "7"
      - key: NVIDIA_NIM_VOICE_CHAT_MODEL
        value: nvidia/nemotron-3-nano-30b-a3b
      - key: NVIDIA_NIM_MAX_TOKENS
        value: "1200"
