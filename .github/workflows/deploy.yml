name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}
  DEPLOY_PATH: /root/pfm

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            REACT_APP_SUPABASE_URL=${{ secrets.REACT_APP_SUPABASE_URL }}
            REACT_APP_SUPABASE_ANON_KEY=${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: mkdir -p "${{ env.DEPLOY_PATH }}/nginx" "${{ env.DEPLOY_PATH }}/backend"

      - name: Upload Docker Compose and Nginx files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "docker-compose.yml,nginx/default.conf"
          target: ${{ env.DEPLOY_PATH }}

      - name: Pull image and restart containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          PFM_IMAGE: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_NIM_MODEL: ${{ secrets.NVIDIA_NIM_MODEL }}
          NVIDIA_NIM_BASE_URL: ${{ secrets.NVIDIA_NIM_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HTTP_PORT: ${{ secrets.HTTP_PORT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: PFM_IMAGE,NVIDIA_API_KEY,NVIDIA_NIM_MODEL,NVIDIA_NIM_BASE_URL,SUPABASE_URL,SUPABASE_SERVICE_KEY,HTTP_PORT
          script: |
            set -eu
            cd "${{ env.DEPLOY_PATH }}"

            printf '%s\n' \
              "NVIDIA_API_KEY=$NVIDIA_API_KEY" \
              "NVIDIA_NIM_MODEL=$NVIDIA_NIM_MODEL" \
              "NVIDIA_NIM_BASE_URL=$NVIDIA_NIM_BASE_URL" \
              "SUPABASE_URL=$SUPABASE_URL" \
              "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" \
              "PORT=8000" > backend/.env
            chmod 600 backend/.env

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "Docker Compose is not installed on the VPS."
              exit 1
            fi

            export PFM_IMAGE
            export HTTP_PORT="${HTTP_PORT:-8080}"
            docker pull "$PFM_IMAGE"
            $COMPOSE down --remove-orphans
            $COMPOSE up -d
            $COMPOSE ps
            docker image prune -f
